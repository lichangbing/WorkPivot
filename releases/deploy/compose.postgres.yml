# 使用独立新数据库，不挂载旧应用数据卷。
# 通过 WORKPIVOT_POSTGRES_IMAGE 提供已审核且按摘要固定的 PostgreSQL 镜像。
# 不公开数据库端口；后端加入 workpivot-database 网络。
services:
  database:
    image: "${WORKPIVOT_POSTGRES_IMAGE:?Set a verified PostgreSQL image digest}"
    environment:
      POSTGRES_DB: workpivot
      POSTGRES_USER: workpivot_schema
      POSTGRES_PASSWORD: "${WORKPIVOT_DATABASE_ADMIN_PASSWORD:?Set an independent database administration password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U workpivot_schema -d workpivot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 60s
volumes:
  postgres-data:
networks:
  database:
    name: workpivot-database
    internal: true
