# 仅开放受限宿主执行器接口，不向后端添加 Docker 套接字、SSH 密钥或 Docker 命令行访问。
services:
  workpivot:
    environment:
      WORKPIVOT_EXECUTION_MODE: worker
      WORKPIVOT_WORKER_URL: "http://host.docker.internal:39990"
      WORKPIVOT_WORKER_TOKEN: "${WORKPIVOT_WORKER_TOKEN:?Missing dedicated worker token}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
