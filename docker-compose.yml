# WorkPivot 企业服务端编排（J02 拓扑二）
# 用法：docker compose up -d  → 浏览器访问 http://<服务器IP>:39800
# 数据持久化：workpivot-data（账户/任务/记忆/审计）、workpivot-workspace（任务工作区/交付物）
services:
  workpivot:
    build: ./code
    image: ${WORKPIVOT_IMAGE:-workpivot-server:0.3.0-dev}
    container_name: workpivot-server
    ports:
      - "127.0.0.1:39800:39800"
    environment:
      WORKPIVOT_MAX_PARALLEL: "16"
      WORKPIVOT_SECRET_KEY: "${WORKPIVOT_SECRET_KEY:?请配置服务端主密钥}"
      WORKPIVOT_ADMIN_INIT_TOKEN: "${WORKPIVOT_ADMIN_INIT_TOKEN:?请配置初始化凭据}"
      WORKPIVOT_SESSION_TTL_HOURS: "24"
      WORKPIVOT_EXECUTION_IMAGE: "${WORKPIVOT_IMAGE:-workpivot-server:0.3.0-dev}"
      TZ: Asia/Shanghai
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - workpivot-data:/data/workpivot
      - workpivot-workspace:/data/workspace
    restart: unless-stopped

volumes:
  workpivot-data:
  workpivot-workspace:
