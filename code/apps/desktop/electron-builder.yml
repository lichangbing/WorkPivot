# Thin desktop client: remote UI, local connection settings and tray only.
# Backend, model credentials, skills and document libraries are deployed on the server.
appId: com.workpivot.desktop
productName: WorkPivot
copyright: Copyright © 2026 WorkPivot
directories:
  output: release
  buildResources: build
# No bundled backend dependencies or native dependency rebuild.
npmRebuild: false
buildDependenciesFromSource: false
# Main/preload bundles and the local connection page.
files:
  - dist/**
  - package.json
# Client branding only.
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
    - target: dir
  # 内部发行不做代码签名（无证书）；exe 元数据保持 Electron 默认
  signAndEditExecutable: false
  artifactName: WorkPivot-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: WorkPivot-Setup-${version}.${ext}
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: WorkPivot-${version}-mac-${arch}.${ext}
dmg:
  title: WorkPivot ${version}
  contents:
    - x: 150
      y: 160
      type: file
    - x: 430
      y: 160
      type: link
      path: /Applications
