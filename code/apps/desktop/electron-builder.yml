# 轻量桌面客户端：只包含远程界面、本地连接设置及托盘。
# 后端、模型凭据、技能和文档库均部署在服务器。
appId: com.workpivot.desktop
productName: WorkPivot
copyright: Copyright © 2026 WorkPivot
directories:
  output: release
  buildResources: build
# 不打包后端依赖，也不重新构建原生依赖。
npmRebuild: false
buildDependenciesFromSource: false
# 主进程、预加载包及本地连接页面。
files:
  - dist/**
  - package.json
# 仅包含客户端品牌资源。
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
    - target: dir
  # 内部发行不做代码签名（无证书）；exe 元数据保持 Electron 默认
  signAndEditExecutable: false
  artifactName: WorkPivot-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: WorkPivot-Setup-${version}.${ext}
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: WorkPivot-${version}-mac-${arch}.${ext}
dmg:
  title: WorkPivot ${version}
  contents:
    - x: 150
      y: 160
      type: file
    - x: 430
      y: 160
      type: link
      path: /Applications
