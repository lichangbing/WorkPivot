splay:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;margin-top:27px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:10px;margin-bottom:18px;padding:25px}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:14px;font-weight:650}.step{border-radius:6px;background:#eef4ef;color:#769581;font-size:11px;padding:5px 8px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}.field:last-child{margin-bottom:0}label,.field-label{font-size:12px;color:#52685a;font-weight:550}input,select,textarea{border:1px solid #dce5de;border-radius:6px;padding:10px 12px;background:white;color:#344c3e;outline:none;width:100%;font-size:13px}input:focus,select:focus,textarea:focus{border-color:#78a389;box-shadow:0 0 0 3px #eef5ef}textarea{resize:vertical;line-height:1.8;min-height:108px}input[type=checkbox],input[type=radio]{width:auto;accent-color:#2b7752}.hint{font-size:11px;color:#94a198;line-height:1.7}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.segmented{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.segmented button{border:1px solid #dfe7e1;border-radius:6px;padding:10px 17px;font-size:12px;color:#7c8c80}.segmented button.selected{border-color:#739e80;background:#f0f6f1;color:#347046}.days{display:flex;gap:6px;margin:8px 0 20px}.days button{border:1px solid #dfe7e1;border-radius:6px;padding:8px 10px;color:#7b8b80;font-size:12px}.days button.selected{background:#e7f1e9;border-color:#90b59a;color:#3a7046}.preview{position:sticky;top:22px}.preview .panel{background:#f0f5f0;border-color:#d9e5dc;padding:23px}.preview h3{font-size:13px;margin-bottom:20px}.preview dl{margin:0;font-size:12px}.preview dt{color:#8b9a8e;margin:18px 0 6px}.preview dd{margin:0;color:#4a6452;line-height:1.8;overflow-wrap:anywhere}.time-list{list-style:none;padding:0;margin:10px 0 0}.time-list li{padding:9px 0;border-bottom:1px solid #dce7de;font-size:12px;color:#4c6a55;display:flex;gap:10px}.time-list span{color:#90a393;font-size:10px}.checkline{display:flex;gap:9px;align-items:flex-start;margin:12px 0;line-height:1.7;font-size:12px;color:#6d8173}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin:25px 0}.error{color:#ab5742;font-size:12px;margin:12px 0}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.detail-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}.detail-kpis div{border-right:1px solid var(--line);padding:0 15px}.detail-kpis span{display:block;font-size:11px;color:#8c9b91;margin-bottom:8px}.detail-kpis strong{font-size:14px;font-weight:500}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;font-weight:500;color:#95a197;background:#f8faf8;padding:13px 15px}td{padding:17px 15px;border-bottom:1px solid #edf1ee;color:#607967}.history-filter{display:flex;gap:15px;color:#7f9184;font-size:12px;margin:20px 0}.detail-note{padding:15px;background:#f6f8f6;border-radius:6px;font-size:12px;color:#789080;line-height:1.8}dialog{border:1px solid #dce5df;border-radius:13px;max-width:510px;width:calc(100% - 32px);padding:30px;color:#354d3f;box-shadow:0 25px 80px #18382225}dialog::backdrop{background:#18312755;backdrop-filter:blur(3px)}dialog h2{margin-bottom:12px}dialog .dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.confirm-box{padding:15px 18px;background:#f2f6f2;border-radius:8px;font-size:12px;line-height:2;margin-top:18px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#294d39;color:white;padding:13px 22px;border-radius:8px;box-shadow:0 6px 25px #26463320;font-size:13px;z-index:9}.hidden{display:none!important}.page-enter{animation:enter .2s ease-out}@keyframes enter{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(min-width:1450px){.content{padding-top:43px}.card{min-height:315px}}@media(max-width:1150px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.editor-grid{grid-template-columns:minmax(0,1fr) 270px}.content{padding:28px}.sidebar{width:175px}.shell{grid-template-columns:175px 1fr}.topbar{padding:0 28px}}@media(max-width:800px){.sidebar{width:64px;padding:24px 8px}.brand{padding:0}.brand span:last-child,.nav-label,.nav span:last-child,.side-bottom,.nav.dim{display:none}.nav{justify-content:center;padding:12px 0;margin-top:25px}.shell{grid-template-columns:64px 1fr}.cards,.editor-grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr);gap:10px}.content{padding:22px 18px}.topbar{padding:0 18px}.preview{position:static}.page-title{align-items:flex-start}h1{font-size:24px}.tabs{gap:0}.tab{padding:8px 9px}.search{width:100%}.row{grid-template-columns:1fr;gap:0}.notice{align-items:flex-start}.detail-kpis{gap:4px}.detail-kpis div{padding:0 8px}.demo-tag{font-size:10px}.form-actions{flex-wrap:wrap}}

<body>
<div class="shell"><aside class="sidebar"><a class="brand" href="#" aria-label="自动化首页"><span class="mark">W</span><span>WorkPivot</span></a><div class="nav-label">工作空间</div><div class="nav dim"><span>▧</span><span>项目与任务</span></div><a class="nav active" href="#"><span>ϟ</span><span>自动化</span></a><div class="nav dim"><span>◇</span><span>技能市场</span></div><div class="side-bottom"><div class="avatar">A</div><div>我的工作空间<div class="tiny">个人版 · 原型预览</div></div></div></aside><main class="main"><header class="topbar"><div>工作空间 <span style="margin:0 10px;color:#c0cbc3">/</span> <strong id="breadcrumb">自动化</strong></div><span class="demo-tag">交互原型 · 不会实际执行</span></header><div class="content" id="app"></div></main></div>
<dialog id="confirm"><h2 id="confirm-title"></h2><div id="confirm-body"></div><div class="dialog-actions"><button class="btn" id="confirm-cancel">返回修改</button><button class="btn primary" id="confirm-ok">确认并启用</button></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
// 所有计划、记录和切换仅在此原型内演示，不调用业务接口。
const skills=[{id:'sales',name:'销售日报生成',version:'v3',icon:'▤',description:'汇总销售表，生成 Word 日报'},{id:'reconcile',name:'财务对账检查',version:'v2',icon:'≋',description:'核对账单差异，输出明细表'},{id:'weekly',name:'项目周报整理',version:'v1',icon:'▧',description:'整理已保存资料，生成项目周报'},{id:'office',name:'Excel 数据汇总',version:'v2',icon:'Σ',description:'聚合表格数据，输出统计结果'}];
const stateLabels={enabled:'已启用',paused:'已停用',draft:'待确认',blocked:'需要处理'};
const base={description:'',requirements:'',project:'销售运营',input:'latest',fileRule:'销售明细*.xlsx',time:'09:00',zone:'Asia/Shanghai',days:[1,2,3,4,5],interval:2,unit:'hours',date:'',end:'',notify:'issues',catchup:'once',timeout:10,origin:'手动创建'};
const initial=[{...base,id:'a1',name:'每日销售简报',skill:'sales',schedule:'daily',state:'enabled',description:'汇总最新销售数据，生成可直接分享的日报。',requirements:'汇总销售额、订单数和区域表现，标注较上一日的变化。生成 Word 日报及 Excel 明细。',last:'昨天 09:00 · 成功',result:'success'}, {...base,id:'a2',name:'每周项目回顾',skill:'weekly',schedule:'weekly',days:[5],time:'17:30',project:'产品研发',fileRule:'项目进展*.docx',state:'enabled',description:'每周五整理项目进展，提取风险与下周重点。',requirements:'从指定项目资料中整理本周进展、风险、待办及负责人。输出一份 Word 周报。',last:'上周五 17:30 · 成功',result:'success',origin:'对话创建'}, {...base,id:'a3',name:'订单数据汇总',skill:'office',schedule:'interval',interval:2,unit:'hours',state:'enabled',description:'每两小时汇总新增订单，输出分类统计表。',requirements:'对最新订单表按产品和地区汇总，生成独立 Excel 成果。',last:'本轮执行中（示例）',result:'running'}, {...base,id:'a4',name:'每周账单核对',skill:'reconcile',schedule:'weekly',days:[1],time:'10:00',project:'财务管理',state:'paused',description:'核对付款与账单，输出金额不一致的明细。',requirements:'比较账单与付款清单，列出缺失、重复及金额不一致的记录。',last:'10月12日 10:00 · 成功',result:'success'}, {...base,id:'a5',name:'整理下周会议资料',fileRule:'会议资料*.docx',skill:'weekly',schedule:'weekly',days:[5],time:'16:00',state:'draft',description:'从对话生成的计划，核对执行要求后即可启用。',requirements:'整理销售运营项目中已保存的会议资料，提取议题和需跟进事项，输出 Word 文档。',origin:'对话创建',last:'尚未运行',result:'none'}, {...base,id:'a6',name:'渠道销售复盘',skill:'sales',schedule:'weekly',days:[1],time:'09:30',state:'blocked',description:'按渠道对比本周业绩，定位需要跟进的变化。',requirements:'根据指定渠道表生成复盘，区分事实与建议。',last:'上周一 09:30 · 失败',result:'failed',issue:'绑定的输入资料已移除，请重新选择资料。'}];
let plans=structuredClone(initial),filter='all',query='',editing=null,dirty=false,confirmAction=null;
const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const skillFor=p=>skills.find(s=>s.id===p.skill)||skills[0];
const weekdays=['日','一','二','三','四','五','六'];
function scheduleText(p){if(p.schedule==='daily')return `每天 ${p.time}`;if(p.schedule==='weekly')return `${p.days.join(',')==='1,2,3,4,5'?'周一至周五':'每周'+p.days.map(d=>weekdays[d]).join('、')} ${p.time}`;if(p.schedule==='interval')return `每 ${p.interval} ${p.unit==='minutes'?'分钟':'小时'}`;return p.date?`${p.date.replace('T',' ')} · 仅一次`:'请选择执行时间';}
// 仅预览上海和 UTC 两种时区；正式调度由服务端解析并校验。
function nextTimes(p){const now=Date.now(),offset=p.zone==='Asia/Shanghai'?8*3600000:0;let list=[];if(p.schedule==='once'){const at=Date.parse(p.date+(p.zone==='Asia/Shanghai'?'+08:00':'Z'));if(at>now)list=[at];}else if(p.schedule==='interval'){const gap=Number(p.interval)*(p.unit==='minutes'?60000:3600000);if(gap>0)list=[1,2,3].map(i=>now+gap*i);}else{const local=new Date(now+offset);for(let n=0;n<22&&list.length<3;n++){const day=new Date(Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate()+n));if(p.schedule==='weekly'&&!p.days.includes(day.getUTCDay()))continue;const [h,m]=(p.time||'09:00').split(':').map(Number);const at=day.getTime()+h*3600000+m*60000-offset;if(at>now)list.push(at);}}if(p.end){const end=Date.parse(p.end+'T23:59:59'+(p.zone==='Asia/Shanghai'?'+08:00':'Z'));list=list.filter(t=>t<=end);}return list.map(t=>new Intl.DateTimeFormat('zh-CN',{timeZone:p.zone,month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(t));}
function toast(msg){const e=document.querySelector('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),3200);}
function badge(p){return `<span class="badge ${p.state}">${stateLabels[p.state]}</span>`;}
function card(p){const s=skillFor(p);const next=nextTimes(p)[0];return `<article class="card"><div class="card-top"><div class="skill-icon">${s.icon}</div><span class="tiny">${esc(s.name)} · ${s.version}</span>${badge(p)}</div><h3>${esc(p.name)}</h3><p class="description">${esc(p.description||p.requirements)}</p><div class="meta"><span class="symbol">◷</span>${esc(scheduleText(p))}<span class="tiny">${p.zone==='Asia/Shanghai'?'上海时间':'UTC'}</span></div><div class="meta"><span class="symbol">↳</span>${p.state==='enabled'?'下次 '+esc(next||'无后续时间'):p.state==='blocked'?esc(p.issue):p.state==='draft'?'确认后开始执行':'已停止后续触发'}</div><div class="runline"><span class="success-dot" style="background:${p.result==='failed'?'#ba8368':p.result==='running'?'#78a9c4':p.result==='none'?'#bec7c0':'#77a489'}"></span>上次运行：${esc(p.last)}</div><footer class="card-bottom"><span class="origin">${p.origin==='对话创建'?'◌':'＋'} ${p.origin}</span><div class="actions"><button data-action="detail" data-id="${p.id}" aria-label="查看${esc(p.name)}详情">详情</button><button data-action="edit" data-id="${p.id}" aria-label="编辑${esc(p.name)}">${p.state==='draft'?'确认设置':'编辑'}</button>${p.state==='draft'?'':`<button data-action="toggle" data-id="${p.id}" aria-label="${p.state==='enabled'?'停用':p.state==='blocked'?'处理':'启用'}${esc(p.name)}">${p.state==='enabled'?'停用':p.state==='blocked'?'处理':'启用'}</button>`}</div></footer></article>`;}
function list(){editing=null;dirty=false;document.querySelector('#breadcrumb').textContent='自动化';app.innerHTML=`<section class="page-enter"><div class="page-title"><div><div class="eyebrow">AUTOMATIONS</div><h1>让重复工作，按时完成</h1><p class="sub">在这里安排技能执行，统一管理手动和对话创建的自动化。</p></div><button class="btn primary" data-action="new">＋ 新增自动化</button></div><div class="summary">${[['全部计划',plans.length,'个自动化'],['正在生效',plans.filter(p=>p.state==='enabled').length,'个已启用'],['待你确认',plans.filter(p=>p.state==='draft').length,'个对话草稿'],['需要处理',plans.filter(p=>p.state==='blocked').length,'个依赖异常']].map(([l,n,u])=>`<div class="stat"><div class="stat-label">${l}<span>↗</span></div><div class="stat-value">${n}<small>${u}</small></div></div>`).join('')}</div><div class="notice"><span>◌　这是可操作的界面原型。示例计划和运行记录均为演示，新增、修改和启用不会触发真实执行，刷新后重置。</span><button class="btn text" data-action="reset">重置示例</button></div><div class="toolbar"><div class="tabs">${[['all','全部'],['enabled','已启用'],['paused','已停用'],['draft','待确认'],['blocked','需处理']].map(([v,l])=>`<button class="tab ${filter===v?'active':''}" data-action="filter" data-filter="${v}">${l}<span>${v==='all'?plans.length:plans.filter(p=>p.state===v).length}</span></button>`).join('')}</div><input class="search" id="search" aria-label="搜索自动化或技能" placeholder="⌕  搜索自动化或技能" value="${esc(query)}"></div><div class="cards" id="cards"></div><p class="footnote">每个计划固定使用已确认的技能版本。技能升级后，计划不会自动切换版本。<br>计划是否启用与单次执行结果独立显示；执行记录集中保存在各自计划详情中。</p></section>`;renderCards();document.querySelector('#search').oninput=e=>{query=e.target.value;renderCards();};}
function renderCards(){const items=plans.filter(p=>(filter==='all'||p.state===filter)&&`${p.name} ${skillFor(p).name}`.toLowerCase().includes(query.toLowerCase()));document.querySelector('#cards').innerHTML=items.map(card).join('')||'<div class="empty"><h3>这里还没有自动化</h3><p>换个筛选条件，或创建第一个计划。</p><button class="btn primary" data-action="new">＋ 新增自动化</button></div>';}
function field(label,content,hint=''){return `<div class="field"><label>${label}</label>${content}${hint?`<div class="hint">${hint}</div>`:''}</div>`;}
function form(id){editing=structuredClone(plans.find(p=>p.id===id)||{...base,id:crypto.randomUUID(),name:'',skill:'sales',schedule:'daily',state:'draft',last:'尚未运行',result:'none'});dirty=false;const p=editing;document.querySelector('#breadcrumb').textContent=`自动化 / ${id?'编辑计划':'新增计划'}`;app.innerHTML=`<section class="page-enter"><button class="back" data-action="back">← 返回自动化</button><div class="page-title"><div><div class="eyebrow">${id?'EDIT AUTOMATION':'NEW AUTOMATION'}</div><h1>${id?'编辑自动化':'新增自动化'}</h1><p class="sub">选择技能、说明执行要求，再安排它何时运行。</p></div><span class="badge ${p.state}">${stateLabels[p.state]}</span></div><form id="editor"><div class="editor-grid"><div><section class="panel"><div class="section-title"><span class="step">01</span>执行什么</div>${field('自动化名称',`<input aria-label="自动化名称" name="name" maxlength="60" required placeholder="例如：每日销售简报" value="${esc(p.name)}">`)}<div class="row">${field('执行的 Skill',`<select name="skill" aria-label="执行的 Skill">${skills.map(s=>`<option value="${s.id}" ${s.id===p.skill?'selected':''}>${s.name} · ${s.version}</option>`).join('')}</select>`,'仅选择已确认且可用的技能。')}${field('成果归属项目',`<select name="project" aria-label="成果归属项目">${['销售运营','产品研发','财务管理'].map(n=>`<option ${n===p.project?'selected':''}>${n}</option>`).join('')}</select>`)}</div>${field('执行要求',`<textarea name="requirements" aria-label="执行要求" required placeholder="告诉技能要处理什么、遵循哪些规则，以及输出什么结果…">${esc(p.requirements)}</textarea>`,'每次运行都使用这段要求；不会自动读取创建计划时的整段对话。')}${field('输入资料',`<select name="input" aria-label="输入资料"><option value="latest" ${p.input==='latest'?'selected':''}>每次读取指定项目中匹配的最新文件</option><option value="fixed" ${p.input==='fixed'?'selected':''}>固定文件版本（示例：销售明细.xlsx · v2）</option><option value="none" ${p.input==='none'?'selected':''}>无需输入文件</option></select>`)}<div id="file-rule-wrap">${field('文件匹配规则',`<input name="fileRule" aria-label="文件匹配规则" value="${esc(p.fileRule)}" placeholder="例如：销售明细*.xlsx">`,'范围仅限所选项目，按文件更新时间取最新一个；未匹配到文件时等待处理。')}</div></section><section class="panel"><div class="section-title"><span class="step">02</span>什么时候执行</div><div class="segmented">${[['once','指定时间'],['daily','每天'],['weekly','每周'],['interval','固定间隔']].map(([v,l])=>`<button type="button" data-action="schedule" data-kind="${v}" class="${p.schedule===v?'selected':''}">${l}</button>`).join('')}</div><div id="schedule-fields"></div><div class="row">${field('时区',`<select name="zone" aria-label="时区"><option value="Asia/Shanghai" ${p.zone==='Asia/Shanghai'?'selected':''}>Asia/Shanghai（北京时间）</option><option value="UTC" ${p.zone==='UTC'?'selected':''}>UTC（协调世界时）</option></select>`)}${field('结束日期（可选）',`<input type="date" name="end" aria-label="结束日期" value="${esc(p.end)}">`,'留空表示持续执行；指定时间任务仅执行一次。')}</div></section><section class="panel"><div class="section-title"><span class="step">03</span>运行与提醒</div><div class="row">${field('服务离线后的处理',`<select name="catchup" aria-label="服务离线后的处理"><option value="once" ${p.catchup==='once'?'selected':''}>恢复后最多补跑一次</option><option value="skip" ${p.catchup==='skip'?'selected':''}>跳过错过的执行</option></select>`)}${field('站内提醒',`<select name="notify" aria-label="站内提醒"><option value="issues" ${p.notify==='issues'?'selected':''}>失败或需要我处理时</option><option value="all" ${p.notify==='all'?'selected':''}>每次完成和失败时</option></select>`)}</div><div class="checkline">✓ 同一计划不会重叠执行；上次仍在运行时，最多保留一次待执行。</div><div class="checkline">✓ 每次生成独立成果，归入本计划的运行记录；不覆盖旧成果。</div></section><div id="form-error" class="error" role="alert"></div><div class="form-actions"><button type="button" class="btn text" data-action="back">取消</button><button type="button" class="btn" data-action="save-paused">保存为停用计划</button><button type="submit" class="btn primary">下一步：确认并启用 →</button></div></div><aside class="preview"><section class="panel"><h3>计划预览</h3><div id="preview"></div></section><div class="hint" style="padding:0 10px">对话创建的自动化也使用这一套设置与确认流程。<br><br>原型中的技能、项目及资料为示例，不读取你的真实文件。</div></aside></div></form></section>`;renderSchedule();bindForm();preview();}
function renderSchedule(){const p=editing;document.querySelectorAll('[data-action=schedule]').forEach(b=>b.classList.toggle('selected',b.dataset.kind===p.schedule));document.querySelector('#schedule-fields').innerHTML=p.schedule==='once'?field('执行日期和时间',`<input type="datetime-local" name="date" aria-label="执行日期和时间" value="${esc(p.date)}">`):p.schedule==='interval'?`<div class="row">${field('间隔',`<input type="number" name="interval" aria-label="执行间隔" min="1" max="10000" value="${p.interval}">`)}${field('单位',`<select name="unit" aria-label="间隔单位"><option value="minutes" ${p.unit==='minutes'?'selected':''}>分钟</option><option value="hours" ${p.unit==='hours'?'selected':''}>小时</option></select>`)}</div><p class="hint">首轮从启用后一个完整间隔开始，最短间隔为 5 分钟。</p>`:`${p.schedule==='weekly'?`<div class="field-label">选择星期</div><div class="days">${[1,2,3,4,5,6,0].map(d=>`<button type="button" data-action="day" data-day="${d}" aria-pressed="${p.days.includes(d)}" class="${p.days.includes(d)?'selected':''}">周${weekdays[d]}</button>`).join('')}</div><div class="hint" style="margin-bottom:16px">周一至周五按自然星期执行，不自动排除法定节假日或识别调休。</div>`:''}${field('执行时间',`<input type="time" name="time" aria-label="执行时间" value="${esc(p.time)}">`)}`;}
function bindForm(){const f=document.querySelector('#editor');f.oninput=f.onchange=e=>{if(!e.target.name)return;editing[e.target.name]=e.target.type==='number'?Number(e.target.value):e.target.value;dirty=true;preview();};f.onsubmit=e=>{e.preventDefault();if(validate())review(editing,()=>save('enabled'));};}
function preview(){const p=editing,s=skillFor(p),times=nextTimes(p);document.querySelector('#file-rule-wrap').classList.toggle('hidden',p.input!=='latest');document.querySelector('#preview').innerHTML=`<dl><dt>名称</dt><dd>${esc(p.name||'未命名自动化')}</dd><dt>执行技能</dt><dd>${esc(s.name)} <span class="tiny">${s.version} · 固定版本</span></dd><dt>执行周期</dt><dd>${esc(scheduleText(p))}</dd><dt>成果位置</dt><dd>${esc(p.project)} / 本计划的运行成果</dd><dt>接下来${p.schedule==='once'?'一次':'三次'}执行（${p.zone==='Asia/Shanghai'?'北京时间':'UTC'}）</dt></dl><ol class="time-list">${times.length?times.map((t,i)=>`<li><span>0${i+1}</span>${t}</li>`).join(''):'<li>尚无可用时间，请完善设置</li>'}</ol><p class="hint">${p.schedule==='interval'?'以现在启用作预览，正式时间在确认时确定。':'仅预览，不会实际安排执行。'}</p>`;}
function validate(){let error='';const p=editing;if(!p.name.trim())error='请填写自动化名称。';else if(!p.requirements.trim())error='请填写执行要求。';else if(p.input==='latest'&&!p.fileRule.trim())error='请填写文件匹配规则。';else if(p.schedule==='weekly'&&!p.days.length)error='请至少选择一个星期。';else if(p.schedule==='interval'&&(!Number.isInteger(p.interval)||p.interval*(p.unit==='minutes'?1:60)<5))error='执行间隔至少为 5 分钟，且必须是整数。';else if(!nextTimes(p).length)error='请选择未来的有效执行时间，并检查结束日期。';document.querySelector('#form-error').textContent=error;if(error)document.querySelector('#form-error').scrollIntoView({behavior:'smooth',block:'center'});return !error;}
function modal(title,body,label,action,cancel='返回修改'){document.querySelector('#confirm-title').textContent=title;document.querySelector('#confirm-body').innerHTML=body;document.querySelector('#confirm-ok').textContent=label;document.querySelector('#confirm-cancel').textContent=cancel;confirmAction=action;document.querySelector('#confirm').showModal();}
function review(p,action){const s=skillFor(p);modal('确认启用自动化',`<p class="sub">启用后将按以下规则运行。此处为交互演示，不会产生真实运行或模型费用。</p><div class="confirm-box"><strong>${esc(p.name)}</strong><br>技能：${esc(s.name)} · ${s.version}<br>时间：${esc(scheduleText(p))}（${p.zone==='Asia/Shanghai'?'北京时间':'UTC'}）<br>首次：${esc(nextTimes(p)[0]||'未确定')}<br>资料：${p.input==='none'?'无需输入文件':p.input==='fixed'?'销售明细.xlsx · v2':esc(p.project)+' / '+esc(p.fileRule)+' / 最新一个'}<br>成果：${esc(p.project)} / 本计划的运行成果</div><p class="hint">正式版中，关闭页面后计划仍会执行。停用只阻止后续触发，当前执行可单独停止。</p>`,'确认并启用',action);}
function save(state){const i=plans.findIndex(p=>p.id===editing.id);const value={...editing,state,description:editing.requirements.slice(0,60),issue:undefined};if(i<0)plans.unshift(value);else plans[i]=value;dirty=false;location.hash='';toast(state==='enabled'?'已启用（仅原型演示）':'已保存为停用计划（仅原型演示）');}
function detail(id){const p=plans.find(p=>p.id===id);if(!p)return list();editing=null;document.querySelector('#breadcrumb').textContent='自动化 / 计划详情';const s=skillFor(p),hasHistory=p.result!=='none';app.innerHTML=`<section class="page-enter"><button class="back" data-action="back">← 返回自动化</button><div class="detail-head"><div><div class="eyebrow">AUTOMATION DETAILS</div><h1>${esc(p.name)}</h1><p class="sub">${p.origin} · ${esc(p.project)} · 固定技能版本</p></div><div style="display:flex;gap:10px;align-items:center">${badge(p)}<button class="btn" data-action="edit" data-id="${p.id}">编辑设置</button><button class="btn primary" data-action="toggle" data-id="${p.id}">${p.state==='enabled'?'停用计划':p.state==='blocked'?'处理问题':'确认启用'}</button></div></div><div class="panel" style="margin-top:28px"><div class="detail-kpis"><div><span>执行技能</span><strong>${esc(s.name)} · ${s.version}</strong></div><div><span>执行周期</span><strong>${esc(scheduleText(p))}</strong></div><div><span>下一次执行</span><strong>${p.state==='enabled'?esc(nextTimes(p)[0]||'无'):'暂不安排'}</strong></div></div><div class="detail-note"><strong>执行要求</strong><br>${esc(p.requirements)}</div>${p.issue?`<p class="error">需要处理：${esc(p.issue)} 自动化已阻止新的执行。</p>`:''}</div><section class="panel"><div class="detail-head"><h2>运行记录</h2><span class="tiny">演示数据 · 每次执行独立留存</span></div><div class="history-filter"><span>全部运行</span><span>时间均为${p.zone==='Asia/Shanghai'?'北京时间':'UTC'}</span></div>${hasHistory?`<div class="table-wrap"><table><thead><tr><th>执行时间</th><th>执行结果</th><th>耗时</th><th>成果</th><th>操作</th></tr></thead><tbody>${[0,1,2].map((n)=>`<tr><td>${n===0?'最近一次':n===1?'上一次':'更早一次'} · 示例记录</td><td>${n===0&&p.result==='failed'?'输入资料不可用':n===0&&p.result==='running'?'运行中':'已完成'}</td><td>${n===0&&p.result==='failed'?'—':'32 秒'}</td><td>${n===0&&['failed','running'].includes(p.result)?'暂无成果':'报告.docx · 明细.xlsx'}</td><td><button class="btn text" data-action="run-detail" data-id="${p.id}" data-index="${n}">查看记录</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有运行记录。确认启用后，首次运行将在计划时间开始。</div>'}</section><p class="footnote">自动化运行记录与普通聊天任务分开展示。通过来源对话创建的计划，也在这里查看配置、记录与成果。</p></section>`;}
function route(){const [page,id]=location.hash.slice(1).split('/');if(page==='new')form();else if(page==='edit')form(id);else if(page==='detail')detail(id);else list();window.scrollTo(0,0);}
document.querySelector('#confirm-cancel').onclick=()=>document.querySelector('#confirm').close();document.querySelector('#confirm-ok').onclick=()=>{document.querySelector('#confirm').close();confirmAction?.();};
app.onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id,p=plans.find(v=>v.id===id);if(action==='new')location.hash='new';if(action==='edit')location.hash='edit/'+id;if(action==='detail')location.hash='detail/'+id;if(action==='back'){if(dirty)modal('放弃未保存的修改？','<p class="sub">此页修改尚未保存，返回后将保留原有计划设置。</p>','放弃修改并返回',()=>{dirty=false;location.hash='';},'继续编辑');else location.hash='';}if(action==='filter'){filter=b.dataset.filter;list();}if(action==='reset'){plans=structuredClone(initial);filter='all';query='';list();toast('示例已重置');}if(action==='schedule'){editing.schedule=b.dataset.kind;dirty=true;renderSchedule();preview();}if(action==='day'){const d=Number(b.dataset.day);editing.days=editing.days.includes(d)?editing.days.filter(v=>v!==d):[...editing.days,d].sort((a,b)=>(a||7)-(b||7));dirty=true;renderSchedule();preview();}if(action==='save-paused'&&validate())save('paused');if(action==='toggle'&&p){if(p.state==='enabled')modal('停用这个自动化？',`<p class="sub">“${esc(p.name)}”将不再触发新的执行，历史记录和成果会保留。</p>${p.result==='running'?'<p class="hint">当前示例运行仍继续。正式版将提供单独的“停止当前执行”操作。</p>':''}`,'确认停用',()=>{p.state='paused';route();toast('已停用，历史记录保留（演示）');},'继续启用');else if(p.state==='blocked'||p.state==='draft')location.hash='edit/'+id;else review(p,()=>{p.state='enabled';route();toast('已恢复启用（演示）');});}if(action==='run-detail'){modal('运行记录 · 演示',`<div class="confirm-box">计划：${esc(p.name)}<br>技能：${esc(skillFor(p).name)} · ${skillFor(p).version}<br>执行要求和输入版本：随本次运行固定保存<br>状态：${b.dataset.index==='0'&&p.result==='failed'?'失败，输入资料已移除':b.dataset.index==='0'&&p.result==='running'?'正在执行':'已完成'}<br>成果：${b.dataset.index==='0'&&['failed','running'].includes(p.result)?'暂无':'报告.docx、明细.xlsx（示例名称）'}</div><p class="hint">正式版可查看实际日志和下载成果；本原型没有真实文件。</p>`,'知道了',()=>{},'关闭');}};
window.addEventListener('hashchange',route);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});route();
</script>
</body></html>
