packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  electron: true
verifyDepsBeforeRun: false
confirmModulesPurge: false
# 旧版缺少许可声明；限定依赖链并由 Office 回归验证兼容性。
overrides:
  'nopt@5>abbrev': 1.1.1
  'exceljs@4.4.0>unzipper': 0.12.3
  'body-parser': 2.4.0
  'image-size': 2.0.4
  'brace-expansion@<1.1.20': 1.1.20
